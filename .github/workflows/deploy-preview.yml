---
name: PR preview

# A preview deploys only when a pull request carries the `deploy-preview` label
# AND an admin approves that specific push. The label decides *which* pull
# requests raise an approval request; the approval is the gate.
#
# `pull_request_target`, not `pull_request`, so that pull requests from forks can
# be previewed too: `pull_request` grants a fork no secrets and no OIDC token,
# and this team works from forks.
#
# Read this before simplifying anything below. Approving a preview runs the head
# commit's code on a runner holding an Azure token, so the approval means "run
# this", not only "show me the page" — glance at whether a pull request touches
# `deploy.sh`, `.github/workflows/` or `basehub/templates/`, not just the change
# you were asked to look at. Three things bound it:
#
#   * `ref:` below pins the exact approved SHA. A branch name or
#     refs/pull/N/merge would move when the head moves, and an already-approved
#     run would then deploy code nobody reviewed. This is the crux of the gate.
#   * the workflow file comes from the base branch, so a fork cannot change the
#     steps — but it DOES supply `deploy.sh` and the chart that those steps run,
#     so this is not a sandbox.
#   * the dev identity can reach the dev cluster and nothing else in the
#     subscription, which is why dev has a cluster of its own.

on:
    pull_request_target:
        types: [labeled, unlabeled, synchronize, reopened, closed]

permissions:
    id-token: write
    contents: read
    pull-requests: write

# The cluster and its resource group come from the environment's variables, not
# from here: a workflow-level `env:` cannot read them, because which environment
# applies is not known until a job declares one.
env:
    DOMAIN: demo.aiidalab.xyz

jobs:
    preview:
        name: Deploy preview
        if: >-
            github.event.action != 'closed'
            && github.event.action != 'unlabeled'
            && contains(github.event.pull_request.labels.*.name, 'deploy-preview')
        runs-on: ubuntu-latest
        environment: dev
        concurrency:
            # Cancels pending runs too, so rapid pushes collapse into one approval
            # for the newest code and nobody approves something already superseded.
            group: preview-pr-${{ github.event.number }}
            cancel-in-progress: true
        steps:
            - name: Checkout the approved commit
              uses: actions/checkout@v4
              with:
                  # The exact SHA, not refs/pull/N/merge: GitHub recomputes that ref
                  # when the head moves, so an approved run could otherwise check out
                  # code pushed after the approval.
                  ref: ${{ github.event.pull_request.head.sha }}
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  persist-credentials: false

            - uses: azure/setup-helm@v4
              with:
                  version: latest

            - name: Render before spending an approval on it
              # validate.yml cannot be a `needs:` dependency — it is a separate
              # workflow — so catch the same class of error cheaply here.
              run: |
                  helm repo add jupyterhub https://jupyterhub.github.io/helm-chart/
                  helm dependency build basehub
                  helm template basehub \
                      -f basehub/values-base.yaml -f basehub/values-dev.yaml \
                      --set jupyterhub.ingress.hosts[0]="pr-${{ github.event.number }}.$DOMAIN" \
                      > /dev/null

            - name: Azure login
              uses: azure/login@v1
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Wake the cluster
              # Sleeps by default to save money. Starting takes 3-5 minutes, so a
              # preview after a quiet spell is slower than one after a recent push.
              run: |
                  state=$(az aks show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_KUBERNETES_CLUSTER }}" --query powerState.code -o tsv)
                  if [ "$state" != "Running" ]; then
                      az aks start -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_KUBERNETES_CLUSTER }}"
                  fi

            - uses: azure/setup-kubectl@v3
              with:
                  version: 'latest'

            - name: Setup kubelogin
              uses: azure/use-kubelogin@v1
              with:
                  kubelogin-version: 'v0.2.19'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Connect to the cluster
              run: |
                  az aks get-credentials -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_KUBERNETES_CLUSTER }}" --overwrite-existing
                  kubelogin convert-kubeconfig -l azurecli

            - name: Deploy
              env:
                  ENVIRONMENT: dev
                  NAMESPACE: pr-${{ github.event.number }}
                  RELEASE: pr-${{ github.event.number }}
                  DUMMY_AUTH_PASSWORD: ${{ secrets.DUMMY_AUTH_PASSWORD }}
              run: |
                  ./deploy.sh \
                      --set jupyterhub.ingress.hosts[0]="pr-${{ github.event.number }}.$DOMAIN"

            - name: Wait for the hub
              run: |
                  ns=pr-${{ github.event.number }}
                  kubectl -n "$ns" rollout status deploy/hub --timeout=600s
                  kubectl -n "$ns" rollout status deploy/proxy --timeout=600s

            - name: Post the URL
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # `--repo` is required: the checkout above replaced the working copy with
              # the pull request's head repository, so without it `gh` would resolve
              # this number against the fork and comment on the wrong pull request, or
              # none. `--edit-last --create-if-none` upserts, so running on every
              # deploy leaves one comment rather than a pile — and a preview whose
              # first run was cancelled by a push still gets its URL.
              run: |
                  gh pr comment ${{ github.event.number }} \
                    --repo "${{ github.repository }}" \
                    --edit-last --create-if-none --body \
                    "Preview: https://pr-${{ github.event.number }}.$DOMAIN

                  Log in with any username and the shared preview password.
                  Rebuilt on every approved push, and removed when this pull request
                  closes or loses the \`deploy-preview\` label.

                  The cluster sleeps when idle, and a sleeping preview is unreachable
                  until it is deployed again."

            - name: Diagnostics
              if: failure()
              run: |
                  ns=pr-${{ github.event.number }}
                  kubectl -n "$ns" get pods -o wide || true
                  kubectl -n "$ns" describe pods || true
                  kubectl -n "$ns" get events --sort-by=.lastTimestamp | tail -30 || true

    teardown:
        name: Remove preview
        if: >-
            (github.event.action == 'closed'
             && contains(github.event.pull_request.labels.*.name, 'deploy-preview'))
            || (github.event.action == 'unlabeled'
                && github.event.label.name == 'deploy-preview')
        # a fork never deployed, so there is nothing to remove

        runs-on: ubuntu-latest
        # Deliberately NOT `dev`: required reviewers apply to every job declaring an
        # environment, and a cleanup waiting for an approval nobody gives would leave
        # previews behind forever.
        environment: dev-cleanup
        concurrency:
            group: teardown-pr-${{ github.event.number }}
            cancel-in-progress: false
        steps:
            - name: Azure login
              uses: azure/login@v1
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - uses: azure/setup-kubectl@v3
              with:
                  version: 'latest'

            - name: Setup kubelogin
              uses: azure/use-kubelogin@v1
              with:
                  kubelogin-version: 'v0.2.19'
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Delete the namespace, if the cluster is awake
              # A stopped cluster costs nothing for an idle namespace, and starting one
              # just to delete it would cost more than leaving it. The sweeper collects
              # it next time the cluster is running.
              run: |
                  state=$(az aks show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_KUBERNETES_CLUSTER }}" --query powerState.code -o tsv)
                  if [ "$state" != "Running" ]; then
                      echo "Cluster is $state; leaving pr-${{ github.event.number }} for the sweeper."
                      exit 0
                  fi
                  az aks get-credentials -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ vars.AZURE_KUBERNETES_CLUSTER }}" --overwrite-existing
                  kubelogin convert-kubeconfig -l azurecli
                  kubectl delete namespace "pr-${{ github.event.number }}" --ignore-not-found --wait=false
