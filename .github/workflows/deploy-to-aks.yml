---
name: Deploy to AKS

on:
    push:
        branches:
            - main # -> staging
            - production # -> production
    workflow_dispatch:

# OIDC token being allowed be generated
permissions:
    id-token: write
    contents: read

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        # main deploys staging; the production branch deploys production
        environment: ${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Azure Login
              uses: azure/login@v1
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Setup kubectl
              uses: azure/setup-kubectl@v3
              with:
                  version: 'latest'

            - name: Setup Helm
              uses: azure/setup-helm@v3
              with:
                  version: 'latest'
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup kubelogin
              uses: azure/use-kubelogin@v1
              with:
                  kubelogin-version: 'latest'

            - name: Connect to AKS
              # Once the cluster has Entra integration and Azure RBAC enabled, the
              # kubeconfig authenticates with a token rather than a certificate, and
              # kubectl needs the kubelogin plugin to obtain one. `-l azurecli` reuses
              # the token azure/login already holds, so no extra credential is needed.
              #
              # Safe to run before that change: on a cluster still issuing certificates
              # convert-kubeconfig finds nothing to convert and exits 0.
              run: |
                  az aks get-credentials \
                      --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
                      --name ${{ vars.AZURE_KUBERNETES_CLUSTER }}
                  kubelogin convert-kubeconfig -l azurecli

            - name: Deploy to AKS
              # Configuration lives in basehub/values-base.yaml plus
              # basehub/values-<environment>.yaml, both committed. Only secrets are
              # passed in here.
              run: ./deploy.sh
              env:
                  ENVIRONMENT: ${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }}
                  OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
                  OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
                  OAUTH_CALLBACK_URL: ${{ vars.OAUTH_CALLBACK_URL }}

            - name: Logout of Azure
              run: az logout
