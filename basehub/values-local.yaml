---
# Local development on kind. Layers on values-base.yaml.
# No secrets are needed: login with any username and the password below.

jupyterhub:
    proxy:
        service:
            type: NodePort
            nodePorts:
                http: 32080
        https:
            enabled: false

    singleuser:
        image:
            pullPolicy: IfNotPresent
        extraEnv:
            CONTAINER_LIFETIME: ''
        cpu:
            guarantee: 0.25
            limit: 0.5
        memory:
            guarantee: 512M
            limit: 1G

    hub:
        db:
            pvc:
                storageClassName: standard
        config:
            JupyterHub:
                authenticator_class: dummy
                template_vars:
                    deployment: Local
            DummyAuthenticator:
                password: demo

    # Pre-pulling the ~5GB singleuser image is valuable in production, where it
    # spares the first visitor a long wait. Here it only makes `helm upgrade`
    # block on a multi-gigabyte pull before the hub is even usable — and the
    # awaiter is a Helm hook, so it blocks the release, not just the pods.
    prePuller:
        hook:
            enabled: false
        continuous:
            enabled: false
