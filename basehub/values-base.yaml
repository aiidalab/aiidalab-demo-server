---
# Shared by every environment. A deployment is always this file plus exactly one
# environment file:
#
#     helm upgrade -f basehub/values-base.yaml -f basehub/values-<environment>.yaml
#
# Secrets are never stored here; they are injected at deploy time (see deploy.sh).
# Anything that differs between environments belongs in the environment file, not
# here. See README.md, "Configuration".

jupyterhub:
    singleuser:
        image:
            # Deliberately a floating tag: the demo exists to show the latest
            # released AiiDAlab. Nothing is persisted (storage.type: none, 12h cull)
            # so no session is long enough to be disrupted by an image change.
            name: aiidalab/qe
            tag: v26.11.0
        cmd:
            - start-singleuser.sh
        # The image's NOTEBOOK_ARGS set --NotebookApp.default_url, which jupyter-server
        # ignores, so without this users land on JupyterLab at /lab.
        defaultUrl: /apps/apps/home/start.ipynb
        storage:
            type: none
            extraVolumes:
                - name: hub-templates
                  configMap:
                      name: hub-templates
                - name: hub-external
                  configMap:
                      name: hub-external
                - name: etc-jupyter
                  configMap:
                      name: user-etc-jupyter
                - name: aiidalab-session-timer-frontend
                  configMap:
                      name: aiidalab-session-timer-frontend
                - name: aiidalab-session-timer-backend
                  configMap:
                      name: aiidalab-session-timer-backend
                - name: aiidalab-session-timer-config
                  configMap:
                      name: aiidalab-session-timer-config
            extraVolumeMounts:
                - name: hub-templates
                  mountPath: /etc/jupyterhub/templates
                - name: hub-external
                  mountPath: /usr/local/share/jupyterhub/static/external
                - name: etc-jupyter
                  mountPath: /etc/jupyter
                # Session timer frontend assets
                - name: aiidalab-session-timer-frontend
                  mountPath: /opt/conda/share/jupyter/nbextensions/aiidalab-session-timer
                # Session timer Python backend
                - name: aiidalab-session-timer-backend
                  mountPath: /opt/conda/share/aiidalab/extensions/aiidalab_uptime.py
                  subPath: aiidalab_uptime.py
                # Enable the nbclassic frontend extension
                - name: aiidalab-session-timer-config
                  mountPath: /opt/conda/etc/jupyter/nbconfig/common.d/aiidalab-session-timer.json
                  subPath: frontend.json
                # Enable the Jupyter Server extension
                - name: aiidalab-session-timer-config
                  mountPath: /opt/conda/etc/jupyter/jupyter_server_config.d/aiidalab-session-timer.json
                  subPath: backend.json
        extraEnv:
            # This is a custom path, so we include it explicitly
            PYTHONPATH: /opt/conda/share/aiidalab/extensions

    hub:
        readinessProbe:
            enabled: true
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
            timeoutSeconds: 5
        db:
            pvc:
                storage: 1Gi
        extraVolumes:
            - name: hub-templates
              configMap:
                  name: hub-templates
            - name: hub-external
              configMap:
                  name: hub-external
        extraVolumeMounts:
            - mountPath: /etc/jupyterhub/templates
              name: hub-templates
            - mountPath: /usr/local/share/jupyterhub/static/external
              name: hub-external
        config:
            Authenticator:
                allow_all: true
                admin_users:
                    - unkcpz
                    - yakutovicha
                    - mikibonacci
                    - giovannipizzi
                    - edan-bainglass
                # Accounts that ran a cryptominer on production (Sept 2026).
                # Deleting them in the admin panel is not enough: OAuth re-creates them on the next login.
                blocked_users:
                    - brennerc331
                    - emullins2
                    - rebeccacedwards39
                    - rlombard33
            JupyterHub:
                # Values read by the custom page templates. Overridden per environment.
                template_vars:
                    title: Welcome to the Materials Cloud AiiDAlab Demo Server
                    subtitle: A pre-configured environment for exploring AiiDAlab
                    deployment: Demo
                    include_policies: false
                    include_qe: true
                    is_mc_deployment: true
                    support_emails:
                        - aiidalab@materialscloud.org
                    institution_logo_src: ""
                    institution_logo_href: ""
                    institution_logo_alt: ""
        extraConfig:
            00-logo: |
                c.JupyterHub.logo_file = "/usr/local/share/jupyterhub/static/external/aiidalab-wide-logo.png"
            02-spawner: |
                c.KubeSpawner.http_timeout = 300
            03-templates: |
                c.JupyterHub.template_paths.append('/etc/jupyterhub/templates')
            04-navigation-handler: |
                from jupyterhub.handlers import BaseHandler

                include_policies = c.JupyterHub.template_vars.get('include_policies', False)

                class AboutHandler(BaseHandler):
                    def get(self):
                        self.write(self.render_template("about.html", sync=True))

                class FAQHandler(BaseHandler):
                    def get(self):
                        self.write(self.render_template("faq.html", sync=True))

                class TermsOfUseHandler(BaseHandler):
                    def get(self):
                        self.write(self.render_template("terms-of-use.html", sync=True))

                class PrivacyPolicyHandler(BaseHandler):
                    def get(self):
                        self.write(self.render_template("privacy-policy.html", sync=True))

                routes = [(r"about", AboutHandler)]
                if include_policies:
                    routes.extend(
                        [
                            (r"terms-of-use", TermsOfUseHandler),
                            (r"privacy-policy", PrivacyPolicyHandler),
                        ]
                    )
                routes.append((r"faq", FAQHandler))
                c.JupyterHub.extra_handlers.extend(routes)

    cull:
        enabled: true
        users: true
        adminUsers: true
        timeout: 43200 # 12 hours
        every: 300 # 5 minutes
        maxAge: 43200 # 12 hours
