---
# Per-pull-request preview environments. Layers on values-base.yaml.
#
# The namespace and hostname are per-PR and are injected at deploy time, not
# stored here. TLS is a single wildcard certificate for *.demo.aiidalab.xyz,
# managed by cert-manager, so the chart's own Let's Encrypt support is off.
#
# Previews deliberately do NOT use GitHub OAuth: an OAuth app has one callback
# URL and no wildcards, so a per-PR hostname cannot complete a login. The OAuth
# path is exercised on staging instead.

jupyterhub:
    proxy:
        https:
            enabled: false
        # Reached through the shared ingress controller, not directly. Left as
        # the chart's default LoadBalancer, every preview namespace would ask
        # Azure for a public IP of its own.
        service:
            type: ClusterIP

    # Wildcard DNS points every pr-N name at one address, so a LoadBalancer per
    # namespace cannot work — they would all contend for it. One shared ingress
    # controller owns the address and routes by Host instead.
    #
    # `hosts` is filled at deploy time (`--set jupyterhub.ingress.hosts[0]=...`):
    # the hostname is per-PR and values files cannot interpolate.
    #
    # No `tls` block: the controller holds the shared wildcard as its
    # default-ssl-certificate, so no namespace needs a copy of the secret.
    ingress:
        enabled: true
        ingressClassName: nginx
        hosts: []
        # There is no `tls` block here, because the controller holds the shared
        # wildcard as its default certificate. nginx then serves HTTPS but does
        # NOT redirect on its own, so without this the login form — and the
        # shared password with it — can be sent over plaintext.
        annotations:
            nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'

    singleuser:
        image:
            pullPolicy: Always
        extraEnv:
            CONTAINER_LIFETIME: ''
        cpu:
            guarantee: 0.25
            limit: 1
        memory:
            guarantee: 1G
            limit: 2G

    hub:
        db:
            pvc:
                storageClassName: default
        config:
            Authenticator:
                # values-base.yaml names Hub administrators on the Authenticator base
                # class, which DummyAuthenticator inherits. It checks only the shared
                # password, so anyone holding it could log in as an admin simply by
                # typing their username. Previews have no per-user identity at all.
                admin_users: []
            JupyterHub:
                authenticator_class: dummy
                template_vars:
                    deployment: Preview
            # DummyAuthenticator.password is injected at deploy time. These URLs are
            # publicly reachable and a login costs a pod, so it must not be "demo".

    # Two extra pods per release, for a preview nobody schedules against.
    scheduling:
        userScheduler:
            enabled: false

    # Pre-pulling the ~5GB singleuser image is valuable in production, where it
    # spares the first visitor a long wait. Here it only makes `helm upgrade`
    # block on a multi-gigabyte pull before the hub is even usable — and the
    # awaiter is a Helm hook, so it blocks the release, not just the pods.
    prePuller:
        hook:
            enabled: false
        continuous:
            enabled: false
