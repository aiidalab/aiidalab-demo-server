apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-templates
data:
  {{- (.Files.Glob "files/etc/jupyterhub/templates/*").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-external
data:
  {{- (.Files.Glob "files/static/external/css/*").AsConfig | nindent 2 }}
  {{- (.Files.Glob "files/static/external/js/*").AsConfig | nindent 2 }}
binaryData:
  {{- $root := . }}
  {{- range $path, $bytes := .Files.Glob "files/static/external/images/*" }}
  {{ base $path }}: '{{ $root.Files.Get $path | b64enc }}'
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-etc-jupyter
data:
  {{- range $name, $content := .Values.etcJupyter }}
  {{- if eq (typeOf $content) "string" }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- else }}
  {{ $name }}: {{ $content | toJson | quote }}
  {{- end }}
  {{- end }}
  {{- (.Files.Glob "files/etc/jupyter/*").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiidalab-session-timer-frontend
data:
  {{- (.Files.Glob "files/extensions/aiidalab_session_timer/frontend/*").AsConfig | nindent 2 }}
  config.json: |
    {{- $lifetime := .Values.jupyterhub.singleuser.extraEnv.CONTAINER_LIFETIME | default "" }}
    {
      "ephemeral": {{ ne $lifetime "" | toJson }},
      "lifetime": {{ $lifetime | quote }}
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiidalab-session-timer-backend
data:
  {{- (.Files.Glob "files/extensions/aiidalab_session_timer/backend/*").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiidalab-session-timer-config
data:
  frontend.json: |
    {
      "load_extensions": {
        "aiidalab-session-timer/main": true
      }
    }
  backend.json: |
    {
      "ServerApp": {
        "jpserver_extensions": {
          "aiidalab_uptime": true
        }
      }
    }
