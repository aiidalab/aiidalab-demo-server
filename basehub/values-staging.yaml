---
# Staging: the production mirror, in its own namespace on the production cluster.
# The only place the real OAuth, canonical-host and TLS paths are exercised.
# Layers on values-base.yaml. OAuth credentials are injected at deploy time.

jupyterhub:
    proxy:
        https:
            enabled: true
            hosts:
                - staging-demo.aiidalab.io
            letsencrypt:
                contactEmail: aiidalab@materialscloud.org

    singleuser:
        image:
            pullPolicy: Always
        extraEnv:
            CONTAINER_LIFETIME: '12:00:00'
        cpu:
            guarantee: 1.5
            limit: 2
        memory:
            guarantee: 5G
            limit: 5G

    # The user-scheduler is the chart's only cluster-scoped object (a ClusterRole and
    # its binding). The staging identity can only act inside the `staging` namespace,
    # so it cannot manage them. Letting it would need a right to create
    # ClusterRoleBindings, which is a right to make itself cluster-admin.
    scheduling:
        userScheduler:
            enabled: false

    hub:
        db:
            pvc:
                storageClassName: default
        config:
            JupyterHub:
                authenticator_class: github
                template_vars:
                    deployment: Staging
